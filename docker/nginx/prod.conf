# =====================================================================
#  OtoRent — Nginx PROD config (inside the frontend container)
#  /        -> static SPA (Vite dist), with client-side routing fallback
#  /api     -> backend container (Express :4000) on the compose network
#  /uploads -> backend (locally-stored upload files)
# =====================================================================
server {
    listen 80;
    server_name _;

    client_max_body_size 10m;
    root /usr/share/nginx/html;
    index index.html;

    # ---- API -> backend (service name "backend" on the compose network) ----
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Uploaded files served by the backend ------------------------------
    location /uploads/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- SPA: everything else falls back to index.html --------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static asset caching (Vite outputs content-hashed filenames).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
